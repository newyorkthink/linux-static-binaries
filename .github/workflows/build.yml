name: Build Static Binaries

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.release_integrity_repair == true && format('Release integrity repair: {0}', inputs.target) || github.event_name == 'workflow_dispatch' && format('Build {0}', inputs.target) || github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择要构建的软件'
        required: true
        default: 'microsocks'
        type: choice
        options:
          - lshw
          - microsocks
          - tcpdump
      release_integrity_repair:
        description: '内部使用：由 Release 完整性监督触发'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'lshw/**'
      - '!lshw/**/*.md'
      - 'microsocks/**'
      - '!microsocks/**/*.md'
      - 'tcpdump/**'
      - '!tcpdump/**/*.md'
      - '.github/actions/build-static/action.yml'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: static-binaries-release
  cancel-in-progress: false

jobs:
  build-lshw:
    name: Build lshw
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'lshw' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build and publish lshw
        uses: ./.github/actions/build-static
        with:
          software_key: lshw
          build_script: lshw/build.sh
          artifact_path: lshw/dist/lshw
          checksum_path: lshw/dist/lshw.sha256
          version_file: lshw/dist/version.txt
          license_file: lshw/COPYING
          asset_name: lshw
          legacy_asset_names: |
            lshw.tar.xz
          github_token: ${{ github.token }}

  build-tcpdump:
    name: Build tcpdump
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'tcpdump' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install tcpdump build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bison \
            flex \
            pkg-config

      - name: Build and publish tcpdump
        uses: ./.github/actions/build-static
        with:
          software_key: tcpdump
          build_script: tcpdump/build.sh
          artifact_path: tcpdump/dist/tcpdump
          checksum_path: tcpdump/dist/tcpdump.sha256
          version_file: tcpdump/dist/version.txt
          license_file: tcpdump/LICENSE
          asset_name: tcpdump
          github_token: ${{ github.token }}

  build-microsocks:
    name: Build MicroSocks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'microsocks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build and publish MicroSocks
        uses: ./.github/actions/build-static
        with:
          software_key: microsocks
          build_script: microsocks/build.sh
          artifact_path: microsocks/dist/microsocks
          checksum_path: microsocks/dist/microsocks.sha256
          version_file: microsocks/dist/version.txt
          license_file: microsocks/COPYING
          asset_name: microsocks
          legacy_asset_names: |
            microsocks-x86_64-linux
          github_token: ${{ github.token }}
