name: Build Static Binaries

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.release_integrity_repair == true && format('Release integrity repair: {0}', inputs.target) || github.event_name == 'workflow_dispatch' && (inputs.target_search != '' && format('Build {0}', inputs.target_search) || inputs.target == 'all' && 'Build all static binaries' || format('Build {0}', inputs.target)) || github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择要构建的软件（选择 all 构建全部）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - lshw
          - microsocks
          - tcpdump
      target_search:
        description: '模糊输入软件名称（可留空；填写时优先于上方下拉）'
        required: false
        default: ''
        type: string
      release_integrity_repair:
        description: '内部使用：由 Release 完整性监督触发'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'lshw/**'
      - '!lshw/**/*.md'
      - 'microsocks/**'
      - '!microsocks/**/*.md'
      - 'tcpdump/**'
      - '!tcpdump/**/*.md'
      - '.github/actions/build-static/**'
      - '.github/scripts/plan_static_jobs.py'
      - '.github/static-binaries.json'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: static-binaries-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      package_count: ${{ steps.plan.outputs.package_count }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select build jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_TARGET: ${{ inputs.target }}
          TARGET_SEARCH: ${{ inputs.target_search }}
          RELEASE_INTEGRITY_REPAIR: ${{ inputs.release_integrity_repair }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/plan_static_jobs.py

  build:
    name: Build ${{ matrix.asset_name }}
    needs: plan
    if: needs.plan.outputs.package_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}

    steps:
      - uses: actions/checkout@v7

      - name: Install package-specific build dependencies
        if: matrix.apt_packages != ''
        shell: bash
        env:
          APT_PACKAGES: ${{ matrix.apt_packages }}
        run: |
          set -Eeuo pipefail
          read -r -a packages <<< "$APT_PACKAGES"
          (( ${#packages[@]} > 0 ))
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Build and publish ${{ matrix.asset_name }}
        uses: ./.github/actions/build-static
        with:
          software_key: ${{ matrix.software_key }}
          build_script: ${{ matrix.build_script }}
          artifact_path: ${{ matrix.artifact_path }}
          checksum_path: ${{ matrix.checksum_path }}
          version_file: ${{ matrix.version_file }}
          license_file: ${{ matrix.license_file }}
          asset_name: ${{ matrix.asset_name }}
          legacy_asset_names: ${{ matrix.legacy_asset_names }}
          github_token: ${{ github.token }}
