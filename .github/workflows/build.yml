name: Build Static Binaries

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Build {0}', inputs.target) || github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择要构建的软件'
        required: true
        default: 'microsocks'
        type: choice
        options:
          - microsocks
          - socat
  push:
    branches: [main]
    paths:
      - 'microsocks/**'
      - '!microsocks/**/*.md'
      - 'socat/**'
      - '!socat/**/*.md'
      - '.github/actions/build-static/action.yml'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: static-binaries-release
  cancel-in-progress: false

jobs:
  build-microsocks:
    name: Build MicroSocks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'microsocks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build and publish MicroSocks
        uses: ./.github/actions/build-static
        with:
          software_key: microsocks
          build_script: microsocks/build.sh
          artifact_path: microsocks/dist/microsocks
          checksum_path: microsocks/dist/microsocks.sha256
          version_file: microsocks/dist/version.txt
          license_file: microsocks/COPYING
          asset_name: microsocks
          legacy_asset_names: |
            microsocks-x86_64-linux
          github_token: ${{ github.token }}

  build-socat:
    name: Build socat
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'socat' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build and publish socat
        uses: ./.github/actions/build-static
        with:
          software_key: socat
          build_script: socat/build.sh
          artifact_path: socat/dist/socat.tar.xz
          checksum_path: socat/dist/socat.tar.xz.sha256
          version_file: socat/dist/version.txt
          license_file: socat/README.md
          asset_name: socat.tar.xz
          github_token: ${{ github.token }}
