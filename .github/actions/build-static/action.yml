# 共享静态构建与发布入口；只处理工具链、统一校验、Release 和版本清单。
# 各软件自行解析官方上游版本并编译，不在公共入口重写专属构建命令。
name: Build and Publish Static Binary
description: Build one package, validate its static ELF output, publish its binary, and update the shared software_versions.json manifest.

inputs:
  software_key:
    description: Stable software identifier used as the software_versions.json key.
    required: true
  build_script:
    description: Repository-relative build script path.
    required: true
  artifact_path:
    description: Repository-relative final binary path.
    required: true
  checksum_path:
    description: Repository-relative SHA-256 file path used for build-time validation.
    required: true
  version_file:
    description: Repository-relative generated version file used to update software_versions.json.
    required: true
  license_file:
    description: Repository-relative upstream license file that must remain present in the repository.
    required: true
  asset_name:
    description: Stable binary asset name in the latest Release.
    required: true
  legacy_asset_names:
    description: Optional newline-separated obsolete Release asset names to remove after the new asset and manifest are published successfully.
    required: false
    default: ''
  github_token:
    description: GitHub token used to create or update the rolling Release.
    required: true

runs:
  using: composite
  steps:
    - name: Install static build toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        # 安装构建 Job 共用的静态工具链和校验工具。
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils build-essential curl file git jq musl-tools

    - name: Build static binary
      shell: bash
      env:
        BUILD_SCRIPT: ${{ inputs.build_script }}
      run: |
        set -Eeuo pipefail
        # 执行构建清单指定的软件构建脚本。
        chmod +x "$BUILD_SCRIPT"
        "$BUILD_SCRIPT"

    - name: Validate release inputs
      shell: bash
      env:
        SOFTWARE_KEY: ${{ inputs.software_key }}
        ARTIFACT_PATH: ${{ inputs.artifact_path }}
        CHECKSUM_PATH: ${{ inputs.checksum_path }}
        VERSION_FILE: ${{ inputs.version_file }}
        LICENSE_FILE: ${{ inputs.license_file }}
        ASSET_NAME: ${{ inputs.asset_name }}
      run: |
        set -Eeuo pipefail

        # 发布前核对标识、产物、许可证、版本及本次构建的 SHA-256。
        [[ "$SOFTWARE_KEY" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "software_key 非法：$SOFTWARE_KEY" >&2; exit 1; }
        [[ -s "$ARTIFACT_PATH" ]] || { echo "产物不存在或为空：$ARTIFACT_PATH" >&2; exit 1; }
        [[ -s "$CHECKSUM_PATH" ]] || { echo "SHA-256 文件不存在或为空：$CHECKSUM_PATH" >&2; exit 1; }
        [[ -s "$VERSION_FILE" ]] || { echo "版本文件不存在或为空：$VERSION_FILE" >&2; exit 1; }
        [[ -s "$LICENSE_FILE" ]] || { echo "许可证文件不存在或为空：$LICENSE_FILE" >&2; exit 1; }
        [[ "$(basename "$ARTIFACT_PATH")" == "$ASSET_NAME" ]] || {
          echo "产物文件名与固定 Release 资产名不一致：$(basename "$ARTIFACT_PATH") != $ASSET_NAME" >&2
          exit 1
        }

        expected_sha256="$(awk 'NR == 1 {print tolower($1)}' "$CHECKSUM_PATH")"
        actual_sha256="$(sha256sum "$ARTIFACT_PATH" | awk '{print tolower($1)}')"
        [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo 'SHA-256 文件内容无效。' >&2; exit 1; }
        [[ "$expected_sha256" == "$actual_sha256" ]] || {
          echo 'SHA-256 文件与最终二进制不一致。' >&2
          exit 1
        }

        # 确认本次构建得到的上游版本不为空。
        version="$(tr -d '\r\n' < "$VERSION_FILE")"
        [[ -n "$version" ]] || { echo '版本内容为空。' >&2; exit 1; }

    - name: Publish binary and update shared version manifest
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOFTWARE_KEY: ${{ inputs.software_key }}
        ARTIFACT_PATH: ${{ inputs.artifact_path }}
        VERSION_FILE: ${{ inputs.version_file }}
        ASSET_NAME: ${{ inputs.asset_name }}
        LEGACY_ASSET_NAMES: ${{ inputs.legacy_asset_names }}
      run: |
        set -Eeuo pipefail

        # latest Release 不存在时按当前仓库的固定发布规则创建。
        if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Latest' \
            --notes 'Rolling release of portable static Linux binaries. Versions and SHA-256 checksums are tracked in software_versions.json.' \
            --latest
          created_release=true
        fi

        # 先上传并核对当前软件的 Release 资产摘要，再进入清单更新流程。
        uploaded=false
        for attempt in $(seq 1 8); do
          if timeout 180 gh release upload latest "$ARTIFACT_PATH" --repo "$GITHUB_REPOSITORY" --clobber; then
            uploaded=true
            break
          fi
          if [[ "$attempt" -eq 8 ]]; then
            echo "$ASSET_NAME 上传 latest Release 失败，已重试 8 次。" >&2
            exit 1
          fi
          sleep $((attempt * 2))
        done

        # 发布后读取本次实际版本，并计算二进制的 SHA-256。
        version="$(tr -d '\r\n' < "$VERSION_FILE")"
        local_sha256="$(sha256sum "$ARTIFACT_PATH" | awk '{print tolower($1)}')"

        # 读取 Release 资产状态，校验上传后的二进制 digest。
        release_json="$RUNNER_TEMP/latest-release-$SOFTWARE_KEY.json"
        matched=false
        for attempt in $(seq 1 12); do
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" > "$release_json"
          release_sha256="$(python3 - "$release_json" "$ASSET_NAME" <<'PY'
        import json, re, sys
        path, asset_name = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        rows = [a for a in data.get('assets', []) if a.get('name') == asset_name]
        if len(rows) != 1:
            raise SystemExit(0)
        digest = rows[0].get('digest') or ''
        if re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
            print(digest.split(':', 1)[1].lower())
        PY
        )"
          if [[ "$release_sha256" == "$local_sha256" ]]; then
            matched=true
            break
          fi
          sleep 5
        done
        [[ "$matched" == true ]] || {
          echo "$ASSET_NAME 的 GitHub Release digest 与当前 Build SHA-256 不一致，禁止更新版本清单。" >&2
          exit 1
        }

        # 各软件构建独立执行；只有共享清单的读改写阶段等待互斥锁。
        # 按 ID 读取资产时将 HTTP 404 交给上层重新定位，其他读取保留原有三次重试。
        read_release_api() (
          local endpoint="$1"
          local temp_dir attempt status max_attempts=3 asset_read=false
          shift
          if [[ "$endpoint" == "repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            max_attempts=1
            asset_read=true
          fi
          temp_dir="$(mktemp -d)" || return 1
          trap 'rm -rf -- "$temp_dir"' EXIT

          for (( attempt=1; attempt<=max_attempts; attempt++ )); do
            if LC_ALL=C gh api "$endpoint" "$@" > "$temp_dir/body" 2> "$temp_dir/error"; then
              cat "$temp_dir/error" >&2
              cat "$temp_dir/body"
              return
            else
              status=$?
            fi
            printf 'GitHub API GET /%s 失败（第 %s/%s 次，退出码 %s）\n' "${endpoint%%\?*}" "$attempt" "$max_attempts" "$status" >&2
            cat "$temp_dir/error" >&2
            if ! grep -Fq '(HTTP 404)' "$temp_dir/error"; then
              return "$status"
            fi
            # 44 仅表示本次按 ID 读取返回 404，不能据此假定锁仍有效或清单为空。
            if [[ "$asset_read" == true ]]; then
              return 44
            fi
            if (( attempt == max_attempts )); then
              return "$status"
            fi
            sleep 2
          done
        )

        manifest_name='software_versions.json'
        workdir="$RUNNER_TEMP/software-versions-$SOFTWARE_KEY"
        manifest="$workdir/$manifest_name"
        base_manifest="$workdir/base-$manifest_name"
        verified_manifest="$workdir/verified-$manifest_name"
        lock_name='software_versions.json.lock'
        lock_file="$workdir/$lock_name"
        lock_upload_error="$workdir/lock-upload-error.txt"
        rm -rf "$workdir"
        mkdir -p "$workdir"

        release_info="$(python3 - "$release_json" "$GITHUB_REPOSITORY" <<'PY'
        import json, sys
        path, repo = sys.argv[1:]
        release = json.load(open(path, encoding='utf-8'))
        release_id = release.get('id')
        upload_url = (release.get('upload_url') or '').removesuffix('{?name,label}')
        expected_url = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets'
        if type(release_id) is not int or release_id <= 0 or upload_url.lower() != expected_url.lower():
            raise SystemExit('无法取得 latest Release ID 或有效的资产上传地址。')
        print(release_id, upload_url, sep='\t')
        PY
        )"
        IFS=$'\t' read -r release_id lock_upload_url <<< "$release_info"

        # 所有构建、Release 上传和当前资产校验都已完成；只在清单读改写临界区等待锁。
        lock_asset_id=''
        lock_owned=false
        # DELETE 成功返回 204 空响应；按 HTTP 状态释放本次锁，不解析响应 JSON。
        release_own_lock() {
          local attempt status http_status
          for attempt in 1 2 3 4 5; do
            status=0
            # 只删除本次上传取得的固定锁 ID，不按名称删除其他写入者的新锁。
            http_status="$(curl --silent --show-error --request DELETE \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              --output /dev/null --write-out '%{http_code}' \
              "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/releases/assets/$lock_asset_id")" || status=$?
            if (( status == 0 )); then
              case "$http_status" in
                204|404)
                  return 0
                  ;;
                408|429|5??)
                  ;;
                *)
                  printf '释放本次写锁失败：HTTP %s，停止重试。\n' "$http_status" >&2
                  return 1
                  ;;
              esac
            fi
            printf '释放本次写锁失败：HTTP %s，curl 退出码 %s（第 %s/5 次）。\n' "$http_status" "$status" "$attempt" >&2
            if (( attempt == 5 )); then
              return 1
            fi
            # 网络中断或服务端暂时失败后，仅重试删除同一个锁 ID。
            sleep $((attempt * 2))
          done
        }
        cleanup_lock() {
          if [[ "$lock_owned" == true && -n "$lock_asset_id" ]]; then
            release_own_lock >/dev/null 2>&1 || true
          fi
        }
        trap cleanup_lock EXIT

        # 每次读取独立快照并传递 API 失败，禁止把失败或短暂缺失误认为可以从空清单开始。
        read_manifest_row() {
          local rows
          rows="$(read_release_api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&publication_read=$(date +%s%N)" \
            -H 'Cache-Control: no-cache' --paginate \
            --jq ".[] | select(.name == \"$manifest_name\") | [.id, (.digest // \"\")] | @tsv")" || return 1
          if [[ -z "$rows" && "${1:-false}" == true ]]; then
            return 0
          fi
          [[ -n "$rows" && "$rows" != *$'\n'* ]] || {
            echo "$manifest_name 不存在或不唯一，禁止覆盖已有清单。" >&2
            return 1
          }
          printf '%s\n' "$rows"
        }

        # 复核锁资产内容属于本次写入，防止失去锁的旧写入者继续覆盖新清单。
        # 75 仅表示首次确认窗口内始终无法按 ID 读到候选锁；此时尚未读取清单，可重新获取锁。
        require_own_lock() {
          local row digest created_epoch now_epoch remaining attempt status
          local lock_listing listed_id listed_digest
          local wait_for_visibility="${1:-false}"
          for attempt in 1 2 3 4 5; do
            printf '写锁校验：资产=%s ID=%s（第 %s/5 轮）。\n' "$lock_name" "$lock_asset_id" "$attempt" >&2
            if row="$(read_release_api \
              "repos/$GITHUB_REPOSITORY/releases/assets/$lock_asset_id?publication_read=$(date +%s%N)" \
              -H 'Cache-Control: no-cache' --jq '[.digest, .created_at] | @tsv')"; then
              break
            else
              status=$?
            fi
            [[ "$status" == 44 ]] || return "$status"

            # 404 后按名称重新核对锁；发现其他锁即停止，不能凭旧 ID 继续写入。
            lock_listing="$(read_release_api \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100&publication_read=$(date +%s%N)" \
              -H 'Cache-Control: no-cache' --paginate \
              --jq ".[] | select(.name == \"$lock_name\") | [.id, (.digest // \"\")] | @tsv")" || return 1
            [[ "$lock_listing" != *$'\n'* ]] || {
              echo "latest Release 中存在多个 $lock_name，禁止继续写入清单。" >&2
              return 1
            }
            if [[ -n "$lock_listing" ]]; then
              listed_id="${lock_listing%%$'\t'*}"
              listed_digest="${lock_listing#*$'\t'}"
              if [[ "$listed_id" != "$lock_asset_id" || ( -n "$listed_digest" && "$listed_digest" != "sha256:$lock_sha256" ) ]]; then
                # 仅首次拿锁时等待上传结果与读取视图一致，期间尚未读取或修改清单。
                if [[ "$wait_for_visibility" == true ]]; then
                  if (( attempt == 5 )); then
                    return 75
                  fi
                  printf '首次写锁确认尚未一致：上传 ID=%s，列表 ID=%s（第 %s/5 轮）；等待后重新确认。\n' "$lock_asset_id" "$listed_id" "$attempt" >&2
                  sleep 2
                  continue
                fi
                echo '清单写锁已变化，禁止继续写入。' >&2
                return 1
              fi
            fi
            if (( attempt == 5 )); then
              if [[ "$wait_for_visibility" == true ]]; then
                return 75
              fi
              echo '无法确认当前 Job 的清单写锁，停止写入。' >&2
              return 1
            fi
            sleep 2
          done
          digest="${row%%$'\t'*}"
          [[ "$digest" == "sha256:$lock_sha256" ]] || {
            echo '清单写锁已变化，禁止继续写入。' >&2
            return 1
          }
          # 保留原有 300 秒过期锁回收；本次上传必须在该期限前结束，避免旧写入者越过锁期限。
          created_epoch="$(date -u -d "${row#*$'\t'}" +%s)" || return 1
          now_epoch="$(date -u +%s)" || return 1
          remaining=$((created_epoch + 290 - now_epoch))
          (( remaining > 0 )) || {
            echo '清单写锁即将到期，停止旧快照写入。' >&2
            return 1
          }
          upload_timeout=$((remaining < 120 ? remaining : 120))
        }

        acquired=false
        initial_lock_failures=0
        for attempt in $(seq 1 180); do
          : > "$lock_upload_error"
          # 每次申请使用新的随机标识，旧候选锁不能充当本次确认成功的依据。
          printf '%s\n' "run=$GITHUB_RUN_ID job=$GITHUB_JOB attempt=$GITHUB_RUN_ATTEMPT" > "$lock_file"
          # matrix 共用 GITHUB_JOB，额外加入软件键和本次随机标识，不能把另一软件的锁当作自己的。
          printf '%s\n' "key=$SOFTWARE_KEY nonce=$(date +%s%N)-$$-$RANDOM" >> "$lock_file"
          lock_sha256="$(sha256sum "$lock_file" | awk '{print tolower($1)}')"
          # 直接使用上传响应返回的 ID，避免依赖资产列表的可见性。
          if lock_response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$lock_file" "$lock_upload_url?name=$lock_name" \
            2>"$lock_upload_error")"; then
            lock_asset_id="$(python3 -c '
        import json, sys
        asset = json.load(sys.stdin)
        asset_id = asset.get("id")
        if type(asset_id) is not int or asset_id <= 0 or asset.get("name") != sys.argv[1] or asset.get("state") != "uploaded":
            raise SystemExit("锁上传响应未返回有效的锁资产 ID。")
        print(asset_id)
        ' "$lock_name" <<< "$lock_response")"
            lock_owned=true
            # 必须确认本次 ID、摘要和有效期后，才算取得锁并允许读取清单。
            if require_own_lock true; then
              acquired=true
              break
            else
              lock_status=$?
            fi
            # 其他 API、摘要、唯一性或有效期错误仍立即停止，不套用重新获取锁。
            [[ "$lock_status" == 75 ]] || exit "$lock_status"
            initial_lock_failures=$((initial_lock_failures + 1))
            printf '首次写锁确认失败：ID=%s（第 %s/5 次）；释放本次候选锁后重新获取。\n' "$lock_asset_id" "$initial_lock_failures" >&2
            # 仅释放上传响应返回的本次 ID；释放失败时退出，不带着未清理的候选锁继续。
            release_own_lock
            lock_owned=false
            lock_asset_id=''
            if (( initial_lock_failures == 5 )); then
              echo '首次写锁确认连续失败 5 次，停止获取锁，未读取或修改清单。' >&2
              exit 1
            fi
            sleep 2
            continue
          fi

          lock_listing="$(read_release_api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate \
            --jq ".[] | select(.name == \"$lock_name\") | [.id,.created_at] | @tsv")"
          mapfile -t lock_rows <<< "$lock_listing"
          if (( ${#lock_rows[@]} > 1 )); then
            echo "latest Release 中存在多个 $lock_name，禁止继续写入清单。" >&2
            exit 1
          fi
          if [[ -z "$lock_listing" ]]; then
            # 422 already_exists：别人刚抢到锁，列表还没刷新。
            # 404/5xx：全量并发打 uploads.github.com 时的瞬时失败，锁并不存在。
            # 这两种都继续等，不要当成“锁系统坏了”直接退出。
            sleep 2
            continue
          fi
          lock_row="${lock_rows[0]}"
          lock_id="${lock_row%%$'\t'*}"
          created_at="${lock_row#*$'\t'}"
          created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)"
          now_epoch="$(date -u +%s)"
          if (( created_epoch > 0 && now_epoch - created_epoch > 300 )); then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$lock_id" >/dev/null 2>&1 || true
          fi
          sleep 2
        done
        [[ "$acquired" == true ]] || {
          echo '短暂等待 software_versions.json 写锁超时。' >&2
          exit 1
        }

        # 取得锁后按唯一资产 ID 下载，并在合并前核对原清单摘要及快照是否仍有效。
        snapshot_ready=false
        saw_manifest=false
        base_digest=''
        manifest_asset_id=''
        for snapshot_attempt in 1 2 3 4 5; do
          # 首轮已在获取锁时完成确认；后续快照重读仍按原规则严格复核锁。
          if (( snapshot_attempt > 1 )); then
            require_own_lock
          fi
          # 每轮按名称重新定位，404 或快照变化后不得继续下载旧 ID。
          base_row="$(read_manifest_row true)"
          if [[ -n "$base_row" ]]; then
            saw_manifest=true
            manifest_asset_id="${base_row%%$'\t'*}"
            base_digest="${base_row#*$'\t'}"
            [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo '原版本清单缺少有效 SHA-256，禁止合并。' >&2
              exit 1
            }
            printf '合并前读取：资产=%s ID=%s（第 %s/5 轮）。\n' "$manifest_name" "$manifest_asset_id" "$snapshot_attempt" >&2
            if read_release_api \
              "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id?publication_read=$(date +%s%N)" \
              -H 'Cache-Control: no-cache' -H 'Accept: application/octet-stream' > "$manifest"; then
              [[ "sha256:$(sha256sum "$manifest" | awk '{print tolower($1)}')" == "$base_digest" ]] || {
                echo '原版本清单内容与资产摘要不一致，禁止用旧内容覆盖。' >&2
                exit 1
              }
              confirmed_row="$(read_manifest_row true)"
              if [[ "$confirmed_row" == "$base_row" ]]; then
                snapshot_ready=true
                break
              fi
              echo '原版本清单在读取期间已变化，禁止覆盖。' >&2
            else
              read_status=$?
              [[ "$read_status" == 44 ]] || exit "$read_status"
            fi
          else
            printf '合并前读取：资产=%s ID=未取得（第 %s/5 轮），等待重新定位。\n' "$manifest_name" "$snapshot_attempt" >&2
          fi
          if (( snapshot_attempt < 5 )); then
            sleep 2
          fi
        done
        if [[ "$snapshot_ready" == true ]]; then
          cp "$manifest" "$base_manifest"
          echo "$SOFTWARE_KEY 合并清单：base_asset=$manifest_asset_id base_digest=$base_digest lock_asset=$lock_asset_id"
        elif [[ "${created_release:-false}" == true && "$saw_manifest" == false ]]; then
          # 仅由本次新建 Release 的 Job 初始化清单，已有 Release 缺失清单时等待后报错。
          require_own_lock
          current_row="$(read_manifest_row true)"
          [[ -z "$current_row" ]] || {
            echo '新 Release 已出现版本清单，请重新读取后再合并。' >&2
            exit 1
          }
          base_row=''
          base_digest=''
          printf '{}\n' > "$manifest"
        else
          echo '五轮内无法取得有效的版本清单快照，禁止合并。' >&2
          exit 1
        fi

        # 仅在本次替换已开始、清单缺失且仍持有写锁时恢复经过校验的原文件。
        manifest_upload_started=false
        finish_publish() {
          local status=$? current_row attempt
          trap - EXIT
          if (( status != 0 )) && [[ "$manifest_upload_started" == true && "$lock_owned" == true && -s "$base_manifest" ]]; then
            if require_own_lock && current_row="$(read_manifest_row true)" && [[ -z "$current_row" ]]; then
              if cp "$base_manifest" "$manifest" && require_own_lock; then
                # 不覆盖可能已上传的正式清单，即使上一次请求的返回状态不明确。
                timeout "$upload_timeout" gh release upload latest "$manifest" --repo "$GITHUB_REPOSITORY" || true
                for attempt in 1 2 3 4 5; do
                  if ! require_own_lock || ! current_row="$(read_manifest_row true)"; then
                    break
                  fi
                  if [[ "${current_row#*$'\t'}" == "$base_digest" ]]; then
                    echo '清单发布失败，已恢复原版本清单。' >&2
                    break
                  fi
                  if [[ -n "$current_row" ]] || (( attempt == 5 )); then
                    break
                  fi
                  sleep 2
                done
              fi
              if [[ "${current_row#*$'\t'}" != "$base_digest" ]]; then
                echo '清单发布失败，未能确认原版本清单已恢复。' >&2
              fi
            fi
          fi
          cleanup_lock
          exit "$status"
        }
        trap finish_publish EXIT

        # 取得写锁后只合并本软件条目，其余软件的版本信息保持不变。
        python3 - "$manifest" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        with open(path, encoding='utf-8') as f:
            data = json.load(f)
        if not isinstance(data, dict):
            raise SystemExit('software_versions.json 不是 JSON 对象')
        data[key] = {'version': version, 'asset': asset, 'sha256': sha256}
        with open(path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2, sort_keys=True)
            f.write('\n')
        PY

        manifest_sha256="$(sha256sum "$manifest" | awk '{print tolower($1)}')"
        uploaded=false
        for attempt in $(seq 1 8); do
          # 重试时允许本次 clobber 已删除旧清单，但仍拒绝覆盖其他写入者的新清单。
          allow_missing=false
          if [[ -z "$base_row" ]] || (( attempt > 1 )); then
            allow_missing=true
          fi
          current_row="$(read_manifest_row "$allow_missing")"
          if [[ -n "$current_row" && "${current_row#*$'\t'}" == "sha256:$manifest_sha256" ]]; then
            uploaded=true
            break
          fi
          if [[ "$current_row" != "$base_row" && ( -n "$current_row" || "$allow_missing" != true ) ]]; then
            echo '清单写入前远端已变化，停止旧快照上传；交由完整性监督处理。' >&2
            exit 1
          fi
          require_own_lock
          manifest_upload_started=true
          if timeout "$upload_timeout" gh release upload latest "$manifest" --repo "$GITHUB_REPOSITORY" --clobber; then
            uploaded=true
            break
          fi
          sleep $((attempt * 2))
        done
        [[ "$uploaded" == true ]] || {
          echo "上传 $manifest_name 失败。" >&2
          exit 1
        }

        # 重新取得刚写入的唯一 Release 资产 ID，并校验 digest、内容和当前软件条目。
        verified=false
        for attempt in 1 2 3 4 5; do
          require_own_lock
          manifest_row="$(read_manifest_row true)"
          if [[ -n "$manifest_row" ]]; then
            manifest_asset_id="${manifest_row%%$'\t'*}"
            manifest_digest="${manifest_row#*$'\t'}"
            if [[ "$manifest_digest" == "sha256:$manifest_sha256" ]]; then
              rm -f "$verified_manifest"
              printf '上传后校验：资产=%s ID=%s（第 %s/5 轮）。\n' "$manifest_name" "$manifest_asset_id" "$attempt" >&2
              if read_release_api \
                "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id?publication_read=$(date +%s%N)" \
                -H 'Cache-Control: no-cache' -H 'Accept: application/octet-stream' > "$verified_manifest"; then
                if [[ "$(sha256sum "$verified_manifest" | awk '{print tolower($1)}')" == "$manifest_sha256" ]] && \
                  python3 - "$verified_manifest" "$SOFTWARE_KEY" "$version" "$ASSET_NAME" "$release_sha256" <<'PY'
        import json, sys
        path, key, version, asset, sha256 = sys.argv[1:]
        data = json.load(open(path, encoding='utf-8'))
        expected = {'version': version, 'asset': asset, 'sha256': sha256}
        raise SystemExit(0 if data.get(key) == expected else 1)
        PY
                then
                  require_own_lock
                  if [[ "$(read_manifest_row true)" == "$manifest_row" ]]; then
                    verified=true
                    break
                  fi
                fi
              else
                read_status=$?
                [[ "$read_status" == 44 ]] || exit "$read_status"
              fi
            fi
          fi
          if (( attempt < 5 )); then
            sleep 2
          fi
        done
        [[ "$verified" == true ]] || {
          echo "$SOFTWARE_KEY 写入 latest Release/$manifest_name 后校验失败。" >&2
          exit 1
        }

        echo "$SOFTWARE_KEY 清单校验完成：asset=$manifest_asset_id sha256=$manifest_sha256"

        release_own_lock
        lock_owned=false
        trap - EXIT

        # 新资产和统一版本清单确认一致后，再处理已经废弃的旧附件。
        for generated_legacy_name in "$ASSET_NAME.sha256" "$SOFTWARE_KEY-LICENSE.txt" "$SOFTWARE_KEY-version.txt"; do
          generated_legacy_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate --jq ".[] | select(.name == \"$generated_legacy_name\") | .id" | head -n 1)"
          if [[ -n "$generated_legacy_asset_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$generated_legacy_asset_id" >/dev/null
          fi
        done

        # 仅在发布成功后处理清单声明的旧资产名称。
        if [[ -n "$LEGACY_ASSET_NAMES" ]]; then
          while IFS= read -r legacy_name; do
            [[ -n "$legacy_name" ]] || continue
            [[ "$legacy_name" != "$ASSET_NAME" ]] || continue

            legacy_asset_id="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate --jq '.[] | [.id,.name] | @tsv' |
                awk -F '\t' -v name="$legacy_name" '$2 == name {print $1; exit}'
            )"
            if [[ -n "$legacy_asset_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$legacy_asset_id" >/dev/null
            fi
          done <<< "$LEGACY_ASSET_NAMES"
        fi

        echo "$SOFTWARE_KEY 已发布，并更新统一 software_versions.json。"
